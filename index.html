<!doctype html>
<html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cămara Mea 2.0</title><link rel="stylesheet" href="style.css">
<header><span>🫙 Cămara Mea <small>2.0</small></span><p>Mai multă ordine. Mai puțină risipă.</p></header>
<main><aside>Versiune locală · Datele rămân în acest browser. Exportă periodic o copie de siguranță.</aside>
<section><h1>Ce ai în cămară?</h1><form id="product-form"><label>Produs<input name="name" required maxlength="100" placeholder="Ex. Făină"></label><label>Cantitate<input name="quantity" type="number" min="0.01" step="0.01" value="1" required></label><label>Unitate<select name="unit"><option>buc</option><option>kg</option><option>g</option><option>l</option><option>ml</option></select></label><label>Expiră la<input name="expiry" type="date"></label><button>Adaugă produs</button></form></section>
<section><div class="toolbar"><h2>Produsele tale</h2><input id="search" aria-label="Caută produse" placeholder="Caută un produs…"><select id="filter" aria-label="Filtrează"><option value="all">Toate</option><option value="soon">Expiră în 7 zile</option><option value="expired">Expirate</option></select></div><p id="summary"></p><div id="products"></div></section>
<section><h2>Lista de cumpărături</h2><form id="shopping-form"><label class="grow">De cumpărat<input name="item" required maxlength="100" placeholder="Ex. Lapte"></label><button>Adaugă pe listă</button></form><ul id="shopping"></ul></section>
<section><h2>Copie de siguranță</h2><button id="export" class="secondary">Exportă datele</button> <label class="import">Importă datele<input id="import" type="file" accept="application/json,.json"></label><p id="status" role="status"></p></section></main><footer>Cămara Mea 2.0 · Ediție regenerată, locală</footer><script src="app.js"></script></html>
